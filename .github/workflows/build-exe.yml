name: Build FileSorter.exe

# Builds a single-file Windows program on every push to main and attaches it to the
# "latest" release, so it can be downloaded without installing Python.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # to create/update the "latest" release

concurrency:
  group: build-exe
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install pyinstaller==6.11.1 send2trash==1.8.3 pytest==8.3.4 anthropic==2.4.0

      - name: Run the tests on Windows
        # a failing safety test must never ship
        run: python -m pytest -q tests

      - name: Build FileSorter.exe
        run: pyinstaller --onefile --windowed --name FileSorter --hidden-import send2trash run.pyw

      - name: Check the program starts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\FileSorter.exe -PassThru
          $title = ""
          for ($i = 0; $i -lt 30 -and -not $p.HasExited; $i++) {
            Start-Sleep -Seconds 2
            $p.Refresh()
            $title = $p.MainWindowTitle
            if ($title -like "File Sorter*") { break }
          }
          if ($p.HasExited) { Write-Error "FileSorter.exe exited (code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force
          # a crash shows an error box instead of our window: that must fail the build
          if ($title -notlike "File Sorter*") { Write-Error "Main window not found (window title: '$title')"; exit 1 }

      - name: Publish to the "latest" release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # keep the "latest" tag on the commit this exe was built from
          git tag -f latest
          git push -f origin refs/tags/latest
          notes="Built automatically from main (commit ${GITHUB_SHA::7}). Download FileSorter.exe and double-click it."
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --notes "$notes"
          else
            gh release create latest --title "File Sorter (latest build)" --notes "$notes"
          fi
          gh release upload latest dist/FileSorter.exe --clobber
